[package]
name = "soulframe-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extract and reconstruct Soulframe music, dialogue, ambience and sound effects from the local game cache."

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
soulframe-cache = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
